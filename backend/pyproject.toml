[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant-backend"
version = "1.0.0"
description = "AI Research Assistant FastAPI Backend (P0 Paper Parser, P1 Page-Grounded QA, P2 Experiment Analyzer)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
    "SQLAlchemy>=2.0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
